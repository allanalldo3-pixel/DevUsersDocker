version: '3.8'

services:
  postgres_db:
    image: bitnami/postgresql:latest
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRESQL_USERNAME=docker
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DATABASE=api_express_prisma
    volumes:
      - pgdata:/bitnami/postgresql
    networks:
      - app_network

  api:
    build: .
    container_name: node_api
    ports:
      - "3333:3333"
    environment:
      - DATABASE_URL=postgresql://docker:docker@postgres_db:5432/api_express_prisma?schema=public
      - PORT=3333
    depends_on:
      - postgres_db
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app_network

volumes:
  pgdata:
    driver: local

networks:
  app_network:
    driver: bridge
